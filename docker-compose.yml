version: '3.8'

services:
  api:
    build: 
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/models:/app/models
      - ./scripts:/app/scripts
    command: ["bash", "-c", "bash /app/scripts/fetch_models.sh && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment:
      - MODEL_ASSETS_DIR=/app/models/bonn
      - LOG_LEVEL=info
      - CORS_ORIGINS=["http://localhost:5173"]
      - DATABASE_URL=postgresql://neuroaegis:password@db:5432/neuroaegis_db
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: neuroaegis
      POSTGRES_PASSWORD: password
      POSTGRES_DB: neuroaegis_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
