version: '3.8'

services:
  api:
    build: 
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/models:/app/models
      - ./scripts:/app/scripts
    command: ["bash", "-c", "bash /app/scripts/fetch_models.sh && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment:
      - MODEL_ASSETS_DIR=/app/models/bonn
      - LOG_LEVEL=info
      - DATABASE_URL=${DATABASE_URL:-postgresql://neuroaegis:password@db:5432/neuroaegis_db}
      - SECRET_KEY=${SECRET_KEY:-ff948120d6c9b84a43343111fb6c417098725c0603c22d40742cc7aa8037efa1}
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neuroaegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-neuroaegis_db}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
