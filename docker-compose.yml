services:
  api:
    build: 
      context: ./app/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - storage_data:/app/storage
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      - MODEL_ASSETS_DIR=/app/models/bonn
      - MAX_EEG_UPLOAD_BYTES=${MAX_EEG_UPLOAD_BYTES:-201326592}
      - LOG_LEVEL=info
      - DATABASE_URL=${CONTAINER_DATABASE_URL:-postgresql://neuroaegis:password@db:5432/neuroaegis_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - STORAGE_DIR=${STORAGE_DIR:-/app/storage}
      - ENABLE_DISTRIBUTED_QUEUE=${ENABLE_DISTRIBUTED_QUEUE:-false}
      - JOB_LEASE_TIMEOUT_SECONDS=${JOB_LEASE_TIMEOUT_SECONDS:-30}
      - STORAGE_ORPHAN_GRACE_SECONDS=${STORAGE_ORPHAN_GRACE_SECONDS:-300}
      - REAPER_INTERVAL_SECONDS=${REAPER_INTERVAL_SECONDS:-5}
      - SECRET_KEY=${SECRET_KEY:-ff948120d6c9b84a43343111fb6c417098725c0603c22d40742cc7aa8037efa1}
    depends_on:
      - db
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  worker:
    build:
      context: ./app/backend
      dockerfile: Dockerfile
    volumes:
      - storage_data:/app/storage
    command: ["python", "-m", "arq", "app.services.worker.WorkerSettings"]
    environment:
      - MODEL_ASSETS_DIR=/app/models/bonn
      - LOG_LEVEL=info
      - DATABASE_URL=${CONTAINER_DATABASE_URL:-postgresql://neuroaegis:password@db:5432/neuroaegis_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - STORAGE_DIR=${STORAGE_DIR:-/app/storage}
      - WORKER_MAX_JOBS=${WORKER_MAX_JOBS:-2}
      - JOB_LEASE_TIMEOUT_SECONDS=${JOB_LEASE_TIMEOUT_SECONDS:-30}
      - WORKER_HEARTBEAT_INTERVAL_SECONDS=${WORKER_HEARTBEAT_INTERVAL_SECONDS:-5}
      - STORAGE_ORPHAN_GRACE_SECONDS=${STORAGE_ORPHAN_GRACE_SECONDS:-300}
      - REAPER_INTERVAL_SECONDS=${REAPER_INTERVAL_SECONDS:-5}
    depends_on:
      - db
      - redis
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neuroaegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-neuroaegis_db}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  storage_data:
