models:
  bonn:
    enabled: true
    path: models/bonn
    default_model: lightgbm
    display_name: "Bonn University EEG"
    expected_channels: 1
    sampling_rate: 173.61
    window_length: 4097
    feature_count: 5
    supported_extensions: [".edf"]
  chbmit:
    enabled: true
    path: models/chbmit
    default_model: lightgbm
    display_name: "CHB-MIT Scalp EEG"
    expected_channels: 23
    sampling_rate: 256.0
    window_length: 15360
    feature_count: 36864
    supported_extensions: [".edf"]

dataset_detection:
  chbmit:
    display_name: "CHB-MIT Scalp EEG"
    expected_channels: 23
    channel_count_min: 22
    channel_count_max: 38
    sampling_rate: 256.0
    sampling_rate_tolerance: 0.5
    filename_patterns: ['(?i)^chb\d+']
  siena:
    display_name: "Siena Scalp EEG"
    expected_channels: 35
    allowed_channel_counts: [35, 45]
    sampling_rate: 512.0
    sampling_rate_tolerance: 0.5
    filename_patterns: ['(?i)^pn\d+[-_]']
