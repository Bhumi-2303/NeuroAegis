[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroaegis-api"
version = "0.1.0"
description = "NeuroAegis ML Inference API"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.110.1",
    "uvicorn==0.29.0",
    "pydantic==2.6.4",
    "pydantic-settings==2.2.1",
    "python-multipart==0.0.9",
    "numpy==1.26.4",
    "pandas==2.2.1",
    "scipy==1.12.0",
    "lightgbm==4.3.0",
    "shap==0.45.0",
    "joblib==1.3.2",
    "PyWavelets==1.5.0",
    "mne==1.7.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1",
    "sqlalchemy==2.0.51",
    "psycopg2-binary==2.9.12",
    "pyyaml==6.0.1",
    "scikit-learn==1.6.1",
    "pyarrow>=21.0.0",
    "torch>=2.0.0",
    "matplotlib>=3.7.0",
    "redis>=5.0.0,<6.0.0",
    "arq>=0.25.0,<0.27.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<1",
    "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.setuptools]
packages = ["app", "models", "config"]
